name: sonrisa

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonrisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonrisa}
      POSTGRES_DB: ${POSTGRES_DB:-sonrisa}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data as in <=17).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP: the Email channel delivers here
      - '${MAILPIT_UI_PORT:-8025}:8025' # Web UI: http://localhost:8025

  # Local stand-in for Slack Incoming Webhooks (D12): POST /hooks/<channel>, web view at /.
  slack-standin:
    build: ./apps/slack-standin
    ports:
      - '${SLACK_STANDIN_PORT:-4010}:4010' # Web UI + webhooks: http://localhost:4010

volumes:
  postgres-data:
