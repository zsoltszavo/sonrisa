name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sonrisa
          POSTGRES_PASSWORD: sonrisa
          POSTGRES_DB: sonrisa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonrisa -d sonrisa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sonrisa:sonrisa@localhost:5432/sonrisa
      # Throwaway key for the CI database only; real deployments supply their own.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate # explicit: postinstall is skipped when node_modules is already up to date
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - run: pnpm build
